<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hamma istaklar</title>
    <style>
        body { text-align: center; }
        #wishes {
            position: relative;
            width: 90%;
            height: 80vh;
            margin: 20px auto;
            border: 1px dashed #ccc;
            overflow: hidden;
        }
        .wish {
            position: absolute;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.5s ease;
        }
    </style>
    <script>
        function randomColor() {
            const colors = [
                "#e74c3c","#3498db","#2ecc71","#9b59b6",
                "#f39c12","#1abc9c","#e67e22","#34495e",
                "#ff5733","#8e44ad","#16a085","#c0392b"
            ];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        async function loadWishes() {
            const response = await fetch("/wishes");
            const wishes = await response.json();

            const counts = {};
            wishes.forEach(w => counts[w] = (counts[w] || 0) + 1);

            const wishesDiv = document.getElementById("wishes");
            wishesDiv.innerHTML = "";

            const maxCount = Math.max(...Object.values(counts));
            const containerWidth = wishesDiv.clientWidth;
            const containerHeight = wishesDiv.clientHeight;

            for (const [text, count] of Object.entries(counts)) {
                const span = document.createElement("span");
                const fontSize = 14 + (count / maxCount) * 36;
                span.style.fontSize = fontSize + "px";
                span.style.color = randomColor();
                span.className = "wish";
                span.textContent = text;

                const x = Math.random() * (containerWidth - 100);
                const y = Math.random() * (containerHeight - 50);
                span.style.left = x + "px";
                span.style.top = y + "px";

                wishesDiv.appendChild(span);
            }
        }

        window.onload = () => {
            loadWishes();
            setInterval(loadWishes, 5000);
        };
    </script>
</head>
<body>
    <h1>🌟 Hamma istaklar 🌟</h1>
    <div id="wishes"></div>
</body>
</html>
