<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR orqali kirish</title>
    <style>
        body {
            background: #000010;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        img {
            width: 500px;
            height: 500px;
            border: 5px solid white;
            border-radius: 15px;
            background: white;
            padding: 10px;
        }

        p {
            margin-top: 15px;
            font-size: 18px;
            color: #ccc;
        }
    </style>
</head>
<body>
    <h1>📱 Отсканируйте QR-код со своего телефона</h1>
    <img src="{{ url_for('static', filename='qr.png') }}" alt="QR Code">
    <p>После входа через QR-код откроется окно для ввода желания .</p>
</body>
</html>
